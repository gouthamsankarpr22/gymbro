<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Glowing Background Halo -->
  <circle cx="256" cy="256" r="140" fill="#10B981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Shield Shape Outline -->
  <path d="M256 90 L380 140 C380 270 330 360 256 422 C182 360 132 270 132 140 Z" 
        fill="#0D1526" stroke="#1E293B" stroke-width="8"/>
  <path d="M256 106 L364 150 C364 260 320 342 256 398 C192 342 148 260 148 150 Z" 
        fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.9"/>

  <!-- Crossed Barbells / Heavy Dumbbell Crest -->
  <!-- Left Weight Plate -->
  <rect x="180" y="220" width="22" height="72" rx="6" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <rect x="162" y="232" width="14" height="48" rx="4" fill="url(#emeraldGrad)"/>

  <!-- Right Weight Plate -->
  <rect x="310" y="220" width="22" height="72" rx="6" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <rect x="336" y="232" width="14" height="48" rx="4" fill="url(#emeraldGrad)"/>

  <!-- Barbell Bar -->
  <rect x="194" y="248" width="124" height="16" rx="4" fill="#F8FAFC"/>
  <!-- Grip knurling -->
  <line x1="236" y1="248" x2="236" y2="264" stroke="#94A3B8" stroke-width="2"/>
  <line x1="244" y1="248" x2="244" y2="264" stroke="#94A3B8" stroke-width="2"/>
  <line x1="252" y1="248" x2="252" y2="264" stroke="#94A3B8" stroke-width="2"/>
  <line x1="260" y1="248" x2="260" y2="264" stroke="#94A3B8" stroke-width="2"/>
  <line x1="268" y1="248" x2="268" y2="264" stroke="#94A3B8" stroke-width="2"/>
  <line x1="276" y1="248" x2="276" y2="264" stroke="#94A3B8" stroke-width="2"/>

  <!-- Golden Crown / Hype Star on Top -->
  <path d="M226 180 L256 150 L286 180 L274 195 L256 184 L238 195 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="148" r="6" fill="#FDE68A"/>

  <!-- Text / Wordmark -->
  <text x="256" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GYMBRO</text>
  <text x="256" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" font-size="14" fill="#34D399" text-anchor="middle" letter-spacing="3">BROTHERHOOD</text>
</svg>
